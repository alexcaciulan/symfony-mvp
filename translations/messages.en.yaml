        tribunal_ambiguous: 'Multiple active tribunals in %county%. Please verify the configuration data.'
        art99_divergent_competence: 'The claims rest on %causes% different causes and competence does not come out the same for each (CPC art. 99 para. 1, each claim valued on its own). File separate petitions, or pick the court manually after checking how each claim is classified.'
        art99_cause_unattributable: 'The file states several causes (%causes%) and some positions do not say which contract they arise from. Fill in the cause of each position at step 3, or pick the court manually: the grouping decides material competence, which is of public order (CPC art. 99).'

# =============================================================================
# Payment order admissibility (CPC art. 1014 + Law 85/2014)
# Messages for OpAdmissibilityValidator — shown in wizard / PDF block.
# =============================================================================
validation:
    op_admissibility:
        OP_BLOCKED_DEREGISTERED: 'The debtor is deregistered with ANAF and no longer has legal personality. The payment order petition is inadmissible. Verify with the Trade Registry.'
        OP_BLOCKED_INSOLVENCY: 'The debtor is in insolvency proceedings (Law 85/2014). The claim must be filed with the bankruptcy estate, not via a payment order.'
        OP_DEFENDANT_FISCALLY_INACTIVE: 'The debtor is declared fiscally inactive by ANAF. The payment order remains legally admissible, but the chances of recovery are low.'
        OP_ANAF_NOT_VERIFIED: 'The debtor''s ANAF status has not been verified. Look up the company by CUI before filing.'
        OP_ANAF_STALE: 'The ANAF check is older than 30 days. Re-verify the fiscal status before filing.'
        OP_INSOLVENCY_NOT_VERIFIED: 'You have not confirmed that the debtor is not subject to the proceedings provided for by Law 85/2014. Go back to the Debtor step and tick the confirmation before filing.'
        OP_INSOLVENCY_STALE: 'The check on the proceedings provided for by Law 85/2014 is older than 7 days, and the situation can change quickly. Check the debtor again, then in the Debtor step untick the confirmation, save and tick it again.'
        OP_PF_BIPF_MANUAL_CHECK: 'Individual debtor: before filing, manually check that the debtor is not subject to the proceedings provided for by Law 151/2015.'
        OP_ITEM_NOT_YET_DUE: 'One claim position has a due date in the future. The claim is not yet due and payable (CPC art. 1014) and the petition is inadmissible for that sum. Correct the due date, exclude the position, or wait until the term falls due.'
        OP_ITEM_DUE_DATE_MISSING: 'One claim position has no due date. Without one, exigibility cannot be proven and no interest is computed. Supply the date or exclude the position.'
        OP_ITEM_PRESCRIBED: 'One claim position fell due more than 3 years ago, so the prescription term appears to have run (Civil Code art. 2517, running from each invoice due date). The court does not apply prescription of its own motion (art. 2512), but the debtor may raise it, and in the payment-order procedure a defence requiring further evidence can lead to the petition being dismissed, with the creditor directed to ordinary proceedings (CPC art. 1021 para. 2). Decide explicitly whether to keep this head.'
        OP_ITEM_UNIMPUTED_PAYMENT: 'One claim position carries a recorded payment that has not been imputed. The sum claimed stays the invoiced one, because imputation follows Civil Code art. 1507-1509 and is your decision. Check that the sum claimed is still certain (CPC art. 1014 para. 1).'
        OP_ITEM_STATED_DEDUCTION: 'One claim position mentions a deduction in its description (advance, retention, partial payment). The sum claimed is the invoiced total, not the difference. Check the document and correct the position before filing: a partly settled claim is not certain (CPC art. 1014 para. 1).'
        OP_BALANCE_BELOW_INVOICES: 'The balance in the account statement or balance confirmation is below the total of the invoices in the file. The difference may be payments already received, but also set-offs or reversals. The sum claimed stays the invoiced one: check that it is still certain (CPC art. 1014 para. 1) and correct the positions already paid (imputing the payments is your call, Civil Code art. 1507-1509).'
        OP_PENALTY_EXCEEDS_PRINCIPAL: 'The contractual penalties (%penalty% lei) exceed the principal (%principal% lei). Exceeding the principal is not a legal threshold, but it is worth checking: the court may reduce the penalty if it finds it manifestly excessive against the loss foreseeable when the contract was concluded (Civil Code art. 1541 para. 1 lit. b), and a debtor defence on that ground may lead to the request being dismissed, with the creditor sent to ordinary proceedings (CPC art. 1021 para. 2). Decide whether to claim the full amount.'
        OP_DEBT_NOT_YET_DUE: 'The claim''s due date is in the future. The claim is not yet due and payable (CPC art. 1014) and the payment order petition is inadmissible: payment cannot be demanded before the due date. Correct the due date or wait until the term falls due.'

