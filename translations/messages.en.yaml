            upcoming: '%days% days left until the prescription term (%date%). Non-prorogable term (NCC art. 2517).'
            expired: 'The prescription term (%date%) was reached %days% days ago (NCC art. 2517).'
    case_status:
        somatie_trimisa:
            title: 'Payment notice generated: %case%'
            message: 'The payment notice for case %case% has been generated. The 15-day term runs from the debtor receiving it (CPC art. 1015 para. 1).'
        cerere_depusa:
            title: 'Payment order ready: %case%'
            message: 'The payment order petition package for case %case% is ready.'
        ordonanta_emisa:
            title: 'Order issued: %case%'
            message: 'A payment order was issued for case %case%. The annulment request term is 10 days from service.'
        definitiva:
            title: 'Enforceable title: %case%'
            message: 'The payment order for case %case% is now final.'
        respinsa:
            title: 'Unfavourable ruling: %case%'
            message: 'On case %case% the court issued an unfavourable ruling.'
        in_anulare:
            title: 'Annulment request filed by the debtor: %case%'
            message: 'The debtor filed an annulment request against the order on case %case% (CPC art. 1024 para. 1). The request does not suspend enforcement unless the court grants suspension against a bond (CPC art. 1024 para. 5). The court decides the request in a panel of 2 judges; no action is required from you until the ruling.'
        anulare_admisa:
            title: 'Annulment request admitted: %case%'
            message: 'The court admitted the annulment request filed by the debtor on case %case%. The payment order has been annulled and is no longer an enforceable title; the ruling is final (CPC art. 1024). If enforcement had started, check that it is stopped. Recovery through common-law proceedings is not covered by the application.'
        anulare_respinsa:
            title: 'Annulment request rejected, order final: %case%'
            message: 'The court rejected the annulment request filed by the debtor on case %case%. The ruling is final (CPC art. 1024 para. 8) and cannot be appealed. The payment order remains an enforceable title.'
    portal_event:
        title: 'Portal activity: %case%'
        message: 'New portal activity for case %case%.'
    missing_communication_date:
        title: 'Enter service date: %case%'
        message: 'Enter the payment order service date on case %case% to start the annulment request term.'

