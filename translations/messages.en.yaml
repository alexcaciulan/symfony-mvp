            og_art2: 'Under art. 2 of Government Ordinance no. 13/2011, where the obligation bears interest and the parties have not expressly set its level, the corresponding statutory interest is owed.'
            og_art3_1: 'Under art. 3 para. (1) of Government Ordinance no. 13/2011, the NBR reference rate is the monetary policy rate set by decision of the NBR Board.'
