            heading: 'The case was closed: the claim was paid in full'
            body: 'Case %case% was closed: the claim was paid in full before the payment order request.'
        inchis_fara_recuperare:
            subject: 'Case closed without recovery: %case%'
            heading: 'The case was closed without recovery'
            body: 'Case %case% was closed without recovering the claim.'
    deadline_alert:
        field_type: 'Deadline type'
        field_date: 'Due date'
        procedural:
            subject: '%type% deadline on case %case%: %days% days left'
            disclaimer: 'Procedural deadline. For the annulment request, the 10 days run from the date the order is served to the debtor (CPC art. 1024 para. 1). If the date falls on a non-working day, the deadline extends to the next working day (CPC art. 181).'
        prescriptie:
            subject: 'Prescription deadline on case %case%: %days% days left'
            disclaimer: 'Material-law term, non-prorogable (NCC art. 2517). Reaching it extinguishes the substantive right of action.'
    portal_event:
        field_type: 'Event type'
        field_date: 'Date'
        field_solution: 'Ruling'
        field_ruling_text: 'Ruling text'
        subject: 'New portal activity for case %case%'
        heading: 'New activity on the court portal'
        body: 'New activity was detected on portal.just.ro for case %case%.'
    missing_communication_date:
        subject: 'Enter the service date for case %case%'
        heading: 'Enter the payment order service date'
        body: 'To start the 10-day annulment request term (CPC art. 1024 para. 1), enter the date the order was served to the debtor on case %case%. Without this date, the case cannot be finalized automatically.'
    # Alerts for cases blocked on an act, with no term running on them. The
    # regularization wording is conditional on purpose: the application cannot know
    # whether the notice arrived, its only evidence would be the very date it asks for.
    blocked_case:
        missing_label: 'What is missing:'
        action_label: 'What to do:'
        STAMP_DUTY_DUE:
            subject: 'The stamp duty reads unpaid on case %case%'
            heading: 'The stamp duty is still recorded as unpaid'
            body: 'Case %case% has a court file number and the stamp duty reads unpaid. The duty is paid in advance (OUG 80/2013 art. 33 para. 1); if the court communicates the obligation to pay, non-payment within the granted term leads to the annulment of the request (art. 33 para. 2). If the duty was already paid, record the payment on the case so the alert stops repeating.'
            missing: 'The stamp duty payment recorded on case %case%.'
            action: 'Pay the duty through the electronic registry, then confirm the payment on the case (through the registry or with the proof of payment).'
        REGULARIZATION_NOTICE_DATE_MISSING:
            subject: 'Case %case% is waiting for the regularization notice date'
            heading: 'If you received the notice, enter its date'
            body: 'On case %case% the stamp duty is deferred pending regularization and the notice date is not recorded. If you received the notice from the court, enter the date it was served: the 10 days to stamp run from it (OUG 80/2013 art. 33 para. 2), and missing them annuls the claim.'
            missing: 'The date the regularization notice was served on case %case%.'
            action: 'If you received the notice, open the case and enter the date it was served, so the 10-day term starts.'
        ENFORCEMENT_REGISTRATION_NUMBER_MISSING:
            subject: 'Case %case% is waiting for the bailiff registration number'
            heading: 'Ask the bailiff for the registration number'
            body: 'On case %case% you declared that you filed the enforcement request, but the registration number received from the bailiff is not recorded. That number closes the three-year enforcement limitation term, still counted from the filing date (CPC art. 708 para. 1 pt. 2). Until then the term stays open, with its alerts silent. This is the only message you will get on this subject; the case stays in the blockage zone for as long as the number is missing.'
            missing: 'The registration number of the enforcement request on case %case%.'
            action: 'Ask the bailiff for the number, then open the case and enter it in the Deadlines tab.'

# =============================================================================
# In-app notifications + Mercure toast text (NotificationDispatcher)
# =============================================================================
notification:
    filing_receipt_received:
        title: 'Automatic receipt confirmation: %case%'
        message: 'A message from the court address, attributed to this transmission, confirms receipt of the email (%date%). It is not a registration of the petition: check the registration on portal.just.ro or with the registry. The date can be proposed in the "Filing date" field of the "Court filing" tab, subject to the lawyer''s confirmation.'
    filing_receipt_overdue:
        title: 'No receipt confirmation: %case%'
        message: 'No receipt confirmation arrived within %days% working days of the transmission. A missing confirmation does not show that the petition was not registered; check the registration with the court. A confirmation received another way can be uploaded on the case card.'
    filing_bounced_permanent:
        address:
            title: 'The email with the petition was returned: %case%'
            message: 'The recipient''s mail server permanently returned the email with the petition (code %code%), reporting the address as unknown. This is not a rejection by the court. The case went back to the generated petition, and the address was reported to the administrator; it stays in use until they decide, and for this case a new transmission to the same address is blocked until then. %deadline% The application does not extend the six-month term that keeps the limitation period interrupted (NCC art. 2540). If that term has passed, the summons no longer interrupts the limitation period, and the petition can still be filed while the limitation period has not run out. The date from which the limitation period runs is checked by the lawyer. Provisional wording, pending legal review.'
        other:
            title: 'The email with the petition was returned: %case%'
            message: 'The recipient''s mail server permanently returned the email with the petition (code %code%). This is not a rejection by the court; the cause may be a full mailbox or a server rule. The case went back to the generated petition, and the address stays in use. %deadline% The application does not extend the six-month term that keeps the limitation period interrupted (NCC art. 2540). If that term has passed, the summons no longer interrupts the limitation period, and the petition can still be filed while the limitation period has not run out. The date from which the limitation period runs is checked by the lawyer. Provisional wording, pending legal review.'
        size:
            title: 'The email with the petition was returned for its size: %case%'
            message: 'The recipient''s mail server returned the email with the petition because of its size (code %code%). This is not a rejection by the court. The case went back to the generated petition; the annexes can be split into smaller volumes where possible. %deadline% The application does not extend the six-month term that keeps the limitation period interrupted (NCC art. 2540). If that term has passed, the summons no longer interrupts the limitation period, and the petition can still be filed while the limitation period has not run out. The date from which the limitation period runs is checked by the lawyer. Provisional wording, pending legal review.'
        annex:
            title: 'Annex email returned: %case%'
            message: 'The recipient''s mail server returned email %k% of %n% (code %code%) after accepting it. The annexes in this email may not have reached the court. The transmission can no longer be resumed automatically; check the situation and, if needed, file the annexes another way.'
    filing_delivery_delayed:
        title: 'Delayed delivery: %case%'
        message: 'A mail server reported that delivery of email %k% of %n% is delayed (code %code%). Delayed delivery; no effect on the transmission status. Nothing is resent automatically.'
    filing_cc_bounced:
        title: 'CC copy returned: %case%'
        message: 'The copy sent to the lawyer in CC was returned (code %code%). The email to the court is not affected. Check the email address in the profile.'
    filing_court_message:
        forwarded:
            title: 'Message received from the court address: %case%'
            message: 'A message received on the platform address (%date%) was forwarded to the lawyer''s email. The platform address is not a procedural address: the platform does not receive procedural communications and no term runs from receipt on the platform. Check the case on portal.just.ro and with the registry, and answer the court from your own address.'
        in_copy:
            title: 'Message received from the court address: %case%'
            message: 'A message received on the platform address (%date%) already has the lawyer among its recipients, so it was not forwarded. The platform address is not a procedural address: the platform does not receive procedural communications and no term runs from receipt on the platform. Check the case on portal.just.ro and with the registry.'
    filing_late_bounce_review:
        title: 'Delivery report after the case moved on: %case%'
        message: 'A delivery report arrived for the email with the petition (code %code%), but the case already shows that the petition may have reached the court. Nothing was undone automatically, and the remaining emails are no longer sent. The situation is checked with the court, then confirmed on the case card.'
    filing_inbound_review:
        title: 'Received message to review: %case%'
        message: 'A message received on the platform address (%date%) seems to concern this transmission, but the link is not certain. Possible match, needs confirmation; nothing was applied. The message can be downloaded from the case card.'
    inbound_poll_stale:
        title: 'Inbound mailbox not read'
        message: 'Last successful read of the inbound mailbox: %since% (limit: %minutes% minutes). Court confirmations and replies are not picked up until this is fixed.'
    filing_sent:
        title: 'Petition transmitted to the court: %case%'
        message: 'The petition was transmitted to %address%; there is no receipt confirmation yet.'
    filing_annexes_cancelled:
        title: 'Annexes not transmitted: %case%'
        message: 'Only these were transmitted: %sent%. Not transmitted: %not_sent%. The annexes were not sent and must be filed separately.'
    filing_failed_temporary:
        retrying:
            title: 'Sending did not work: %case%'
            message: 'Email %k% of %n% was not accepted by the recipient''s server (temporary error, code %code%). It is retried automatically after 5 minutes, 30 minutes and 2 hours; next try: %next%. The automatic retry does not guarantee delivery. If a deadline is close, check the situation and, if needed, file through another channel.'
        exhausted:
            title: 'Sending failed after the retries: %case%'
            message: 'Email %k% of %n% was not accepted by the recipient''s server even after the automatic retries (last code: %code%). Nothing else is sent automatically. If a deadline is close, check the situation and, if needed, file through another channel.'
    filing_failed_permanent:
        address:
            title: 'Sending was refused: %case%'
            message: 'The recipient''s server rejected the address (code %code%). The address is out of use until the administrator checks it. Nothing was resent. Meanwhile, the petition can be filed another way.'
        other:
            title: 'Sending was refused: %case%'
            message: 'The recipient''s server refused email %k% of %n% for good (code %code%). Nothing was resent. Check the situation and, if needed, file through another channel.'
    filing_failed_size:
        resplit:
            title: 'Email refused for size: %case%'
