            body: 'Case %case% moved to enforcement on the basis of the enforceable title (the final payment order).'
        executare_anulare_respinsa:
            subject: 'Annulment request rejected, enforcement continues on case %case%'
            heading: 'The annulment request was rejected, enforcement continues'
            body: 'On case %case%, the annulment request was rejected while enforcement was already running. The order remains an enforceable title and enforcement continues (the annulment request does not suspend enforcement, CPC art. 1024 para. 5; the rejection ruling is final, para. 8).'
        inchis_succes:
