court:
    resolver:
        invalid_amount_zero: 'Claim amount cannot be zero. Please enter the principal amount.'
        invalid_amount_negative: 'Claim amount cannot be negative. Please verify the data entered.'
        county_unknown: 'Debtor county is not specified or unrecognized.'
