# =============================================================================
# Deadlines agenda (deadlines/*.html.twig)
# =============================================================================
deadlines:
    title: 'Deadlines'
    heading: 'Deadlines'
    window: 'Deadlines across all your active cases, through %date%. Email alerts run daily at 07:00.'
    counter:
        overdue: 'Overdue'
        today: 'Due today'
        fatal30: 'Fatal within 30 days'
        blocked: 'Blocked cases'
    action:
        open_case: 'Open the case'
        open_portal: 'Open Portal'
        mark_done: 'Mark as done'
        mark_stamped: 'Mark as stamped'
        send_summons: 'Send the summons'
        generate_payment_order: 'Generate the payment order request'
        no_annulment_request: 'I am not filing an annulment request'
        note:
            mark_done: 'Closes the deadline in the agenda and stops the alerts. It is not proof that the act was performed.'
            no_annulment_request: 'Closes the deadline and stops the alerts. The ten days run regardless; if you change your mind you may still file until they expire.'
    blockage:
        SUMMONS_COMMUNICATION_MISSING:
            label: 'The summons communication date is not recorded'
            missing: 'Answer to the summons, 15 days'
            legal_basis: 'CPC art. 1015 para. 1'
            state: 'Service in progress'
            cause: 'The summons was generated, but the communication date is not recorded. Service is in progress.'
            consequence: 'The 15-day term is not created at all: it runs from the debtor receiving the summons, not from it being generated. Until you record the communication date no term appears in the agenda, and a payment order request filed meanwhile may be dismissed as premature.'
            action: 'Record the communication date'
        SUMMONS_PROOF_MISSING:
            label: 'The proof of communication of the summons is missing'
            missing: 'The proof of communication, at filing'
            legal_basis: 'CPC art. 1016 para. 2'
            state: 'No proof attached'
            cause: 'The communication date is recorded and the 15-day term is running. The proof of communication, however, is not attached to the case.'
            consequence: 'The payment order request cannot be generated without the proof: the proof of communication is attached to the petition under sanction of it being dismissed as inadmissible, and the court is shown the bailiff record or the acknowledgement of receipt, not the date you stated. Attach the proof now, while you can still ask the bailiff or the post office for a copy, rather than on the day the package has to be filed.'
            action: 'Upload the proof of communication'
        RULING_COMMUNICATION_MISSING:
            label: 'The ruling communication date is not recorded'
            missing: 'Annulment request, 10 days'
            legal_basis: 'CPC art. 1024 para. 1'
            state: 'Service in progress'
            cause: 'The order was issued, but the ruling communication date is not recorded.'
            consequence: 'The term is one of forfeiture. Without the date it is never created and raises no alert.'
            action: 'Record the date the order was served'
        STAMP_DUTY_NOTICE_MISSING:
            label: 'The stamping notice date is not recorded'
            missing: 'Stamp duty, 10 days'
            legal_basis: 'OUG 80/2013 art. 33 para. 2'
            state: 'Awaiting the notice'
            cause: 'The claim was filed with the duty unpaid or deferred to regularization, but the stamping notice date is not recorded.'
            consequence: 'Failing to stamp within the term granted by the court annuls the claim.'
            action: 'Record the notice date'
        ANNULMENT_RULING_COMMUNICATION_MISSING:
            label: 'Service date of the annulment ruling is missing'
            missing: 'Enforcement limitation, 3 years'
            legal_basis: 'CPC art. 705 para. 2 read with art. 1024 para. 8'
            state: 'Service in progress'
            cause: 'An annulment request was filed on this case and the order became final through the ruling on it. The service date of that ruling is not recorded.'
            consequence: 'The term is not created. Anchored on the initial order it would expire earlier than the real one, because the order did not become final when the 10 days lapsed. Until you record the date, the enforcement limitation is not tracked.'
            action: 'Record the service date of the annulment ruling'
        EXECUTION_ANCHOR_MISSING:
            label: 'No date for the enforcement limitation period to run from'
            missing: 'Enforcement limitation, 3 years'
            legal_basis: 'CPC art. 705 para. 1'
            state: 'No date to run from'
            cause: 'The case is final, but neither the ruling communication date nor the pronouncement date is recorded.'
            consequence: 'The term is not created: any date the application could use would be later than the real one, so it would show a term longer than the one actually running. Until you record one of the two dates, the enforcement limitation is not tracked.'
            action: 'Record the ruling communication date'
        ENFORCEMENT_REGISTRATION_NUMBER_MISSING:
            label: 'The bailiff registration number is missing'
            missing: 'Closing the enforcement limitation'
            legal_basis: 'CPC art. 705 para. 1'
            state: 'Waiting for the number'
            cause: 'The enforcement request is recorded as filed, but the registration number received from the bailiff is not entered.'
            consequence: 'The limitation was interrupted on the very day the request was filed (CPC art. 708 para. 1 pt. 2), whether or not the number is entered. The application still keeps the three-year term open, with its alerts silent, until a confirmation arrives from outside: the registration number. That is an extra check the platform asks for before an irreversible closing, not a condition the law imposes. Enter the number and the term closes, still counted from the filing date.'
            action: 'Record the registration number'
    counter_hint:
        today: 'through 24:00'
        blocked: 'cases, not deadlines'
    counter_aria:
        overdue: 'Overdue deadlines'
        today: 'Deadlines due today'
        fatal30: 'Fatal deadlines within the next 30 days'
        blocked: 'Cases whose next step is blocked'
    filter:
        show_completed: 'Show completed'
        clear: 'Clear filters'
        counters_note: 'The numbers count the whole open agenda, not just the active selection.'
        empty_heading: 'No deadline matches the active selection'
        empty_body: 'The pressed pills narrow the agenda. Release them to see the whole window again.'
    add:
        open: 'Add deadline'
        field_case_label: 'Case'
        field_case_placeholder: 'Choose the case'
        field_case_required: 'Choose the case the deadline is added to.'
        flash_added: 'The deadline has been added.'
        flash_error_validation: 'The deadline could not be added. Check the data you entered.'
    confirm:
        cancel: 'Cancel'
        fact:
            case: 'Case'
            deadline_type: 'Deadline'
            deadline_date: 'Falls due on'
            stamp_duty_status: 'Stamp duty status'
            stamp_duty_amount: 'Amount'
            stamp_duty_paid_at: 'Paid on'
            stamp_duty_uat: 'Beneficiary (UAT)'
            unknown: 'unknown'
        stamp_duty:
            title: 'Closing the stamp duty deadline'
            body: 'Failing to pay the stamp duty within the term granted by the court annuls the claim (Government Emergency Ordinance 80/2013 art. 33 para. 2, Code of Civil Procedure art. 197). Closing takes the deadline out of the agenda and stops the email alerts. It is not proof of payment: the receipt is attached to the claim and filed with the court.'
            warning_unpaid: 'On this case the duty is not recorded as paid. If you close it now, the agenda shows the stamp duty as settled while the application holds no proof of payment. Closing is a statement of yours, not evidence.'
        forfeiture:
            title: 'Confirming that you are not filing an annulment request'
            body: 'The annulment request is filed within 10 days of the ruling being communicated (Code of Civil Procedure art. 1024 para. 1). The term is one of forfeiture: missing it extinguishes the remedy, and reinstatement may be sought only by proving well founded reasons, within 15 days of the impediment ceasing (Code of Civil Procedure art. 186). Closing stops the alerts on this deadline. The ten days run to maturity regardless: if you change your mind you may still file until then, but the application will no longer remind you.'
    section:
        overdue: 'Overdue'
        unblocked: 'Unblocked: the payment order request can be filed'
        unblocked_hint: 'terms of the debtor, expired'
        today: 'Today, %date%'
        tomorrow: 'Tomorrow, %date%'
        rest_of_week: 'Rest of the week, through %date%'
        next30: 'Next 30 days, through %date%'
        count: '(%count%)'
        oldest: 'oldest: %days% days'
        today_note: 'The term expires at 24:00 (CPC art. 182 para. 1). An act filed with the court expires when the registry closes (art. 182 para. 2); filing today by registered letter or express courier is still in time (art. 183 para. 1).'
        show: 'Show'
        hide: 'Hide'
    row:
        due_today: 'due today'
        due_in: '{1}in 1 day|]1,Inf[in %count% days'
        overdue_by: '{1}overdue by 1 day|]1,Inf[overdue by %count% days'
        expired_by: '{1}expired 1 day ago|]1,Inf[expired %count% days ago'
        consequence_consumed: 'the consequence may already have occurred'
        completed: 'completed'
        estimate:
            unconfirmed_fact:
                mark: 'estimated date'
                note: 'The date is computed from the fact that starts the term, and that fact has no confirmed date on the case. Record the real date on the case: the term is recomputed and becomes certain.'
            # The date in the marker is computed, never written by hand: it is the date
            # the summons was communicated plus 6 months, the same arithmetic the
            # "Petition filing" deadline is stored with.
            prescription_interrupted:
                mark: 'limitation period interrupted until %date%'
                note: 'The communicated summons interrupted the limitation period (CPC art. 1015 para. 2, referring to NCC art. 2540). The interruption holds if the request reaches the court by %date%, a date tracked separately as the "Petition filing" deadline. You may file later, but the limitation period is then computed as if the summons had never been sent. The date on the row is still the due date plus 3 years, computed without any interruption.'
            prescription_interrupted_by_filing:
                mark: 'limitation period interrupted by the request filed'
                note: 'A request filed in court interrupts the limitation period on its own (NCC art. 2537 pt. 2), so the interruption no longer depends on the six months from the communication of the summons. It is deemed never to have happened only if the request is dismissed, annulled or lapses (NCC art. 2539 para. 2). The date on the row is still the due date plus 3 years, computed without any interruption.'
        internal_number: 'internal no.'
        no_court: 'not filed with a court'
        principal: 'principal %amount% %currency%'
        unblocks_filing: 'Unblocks filing'
        badge_aria: 'Consequence of missing it: %consequence%'
    rail:
        heading: 'Limitation periods, long horizon'
        subtitle: 'More than 30 days out. Excluded from the triage counters.'
        note: 'The enforcement limitation period is only created on final cases, 3 years from the service of the ruling that made the order final, and it closes when you record the registration number the bailiff assigned. Moving the case to enforcement does not close it on its own: while the number is missing the term stays open and only its alerts stop. It never shows up in the main column.'
    blockages:
        heading: 'Blocked cases: what is holding up the next step'
        count: '(%count%)'
        description: 'These cases are missing something only you can supply: either the date of the fact a fatal term runs from, in which case the term is never created, or a piece the procedure imposes, in which case the filing cannot go out. Supply it and the blockage is gone.'
        open: 'Open'
        close: 'Close'
        missing: 'Missing:'
    footnote: 'Email alerts go out daily at 07:00. Procedural terms are announced 7, 3 and 1 day before and on the day of expiry; limitation terms earlier: 30 and 14 days for the general one, 60 and 30 days for the six months to file. This page remains the primary warning mechanism.'
    empty:
        heading: 'No deadline to track'
        body: 'Deadlines appear on their own from the first case. You do not enter them: the application computes them from the data filled in the request and moves them if the date of the generating fact changes.'
        cta: 'Start the first case'
        list_heading: 'What the application will track for you'
        list_subtitle: 'Each deadline is created automatically the moment the fact that triggers it occurs.'
        item:
            summons_answer: 'Answer to the summons, 15 days'
            summons_answer_hint: 'From the day the summons is communicated. CPC art. 1015 para. 1.'
            filing_interruption: 'Filing the request, 6 months'
            filing_interruption_hint: 'From the communication of the summons. If the request reaches the court later, the interruption of the limitation period is deemed never to have happened. NCC art. 2540.'
            stamp_duty: 'Stamp duty, 10 days'
            stamp_duty_hint: 'From the court notice. Failing to stamp annuls the claim. OUG 80/2013 art. 33 para. 2.'
            annulment: 'Annulment request, 10 days'
            annulment_hint: 'From the communication of the order. A forfeiture term. CPC art. 1024 para. 1.'
            prescription: 'Limitation, 3 years per due date'
            prescription_hint: 'One deadline for every invoice. Civil Code art. 2517.'
            hearing: 'Hearing dates'
            hearing_hint: 'Taken from portal.just.ro once the case receives a court number.'
        alerts_note: 'Email alerts go out daily at 07:00. Procedural terms: 7, 3 and 1 day before and on the day of expiry. General limitation: 30 and 14 days. The six months to file: 60 and 30 days.'
    clean:
        heading: 'Clean register'
        body: 'Zero overdue, zero deadlines due today, zero fatal deadlines in the next 30 days.'
        agenda_heading: 'Nothing to do through %date%'
        agenda_body: 'The active cases are up to date. The next deadline falls outside the agenda window, which stops at %date%.'
    weekday:
        '1': 'Monday'
        '2': 'Tuesday'
        '3': 'Wednesday'
        '4': 'Thursday'
        '5': 'Friday'
        '6': 'Saturday'
        '7': 'Sunday'
