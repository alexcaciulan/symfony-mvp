# =============================================================================
# Homepage (public-facing)
# =============================================================================
home:
    hero:
        eyebrow: 'For lawyers and debt recovery firms'
        title: 'Debt recovery made simple and fast'
        subtitle: 'Complete platform for managing the payment order procedure under OUG 80/2013, from notice to enforcement.'
        cta_primary: 'Start free'
        cta_secondary: 'See how it works'
    steps:
        title: 'How it works'
        step_1:
            label: 'Step 1'
            title: 'Upload documents'
            description: 'Upload contracts, invoices, proofs of communication. Auto-extraction populates the form.'
        step_2:
            label: 'Step 2'
            title: 'We generate the notice'
            description: 'One click and you have a payment notice ready to send. The 30-day clock starts automatically.'
        step_3:
            label: 'Step 3'
            title: 'File the petition'
            description: 'Payment order petition with document index, calculated court fee, competent court determined.'
        step_4:
            label: 'Step 4'
            title: 'We monitor the case'
            description: 'Sync with portal.just.ro: alerts on hearings, annulment applications, rulings.'
    benefits:
        title: 'Why LexRecovery'
        rapid:
            title: 'Fast'
            description: 'Automatic generation of procedural documents, no copy-paste between templates.'
        sigur:
            title: 'Reliable'
            description: 'OUG 80/2013 + CPC art. 1014-1024 compliant. Automatic interest (OG 13/2011) and stamp duty calculations.'
        clar:
            title: 'Clear'
            description: 'All deadlines on one dashboard. Proactive notifications as deadlines approach.'

