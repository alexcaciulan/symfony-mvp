            cc_1535: 'Under art. 1.535 para. (1) of the Civil Code, where a sum of money is not paid when due, the creditor is entitled to moratory damages from the due date until payment, in the amount agreed by the parties or, absent such agreement, in the amount set by law, without having to prove any loss.'
