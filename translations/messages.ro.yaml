            message: 'Ai confirmat depunerea cererii de ordonanță de plată pe dosarul %case%.'
        ordonanta_emisa:
            title: 'Ordonanță emisă: %case%'
            message: 'Pe dosarul %case% a fost emisă ordonanța de plată. Termenul cererii în anulare este de 10 zile de la comunicare.'
        definitiva:
            title: 'Titlu executoriu: %case%'
            message: 'Ordonanța de plată pe dosarul %case% a rămas definitivă.'
        respinsa:
            title: 'Soluție nefavorabilă: %case%'
            message: 'Pe dosarul %case% instanța a pronunțat o soluție nefavorabilă.'
        in_anulare:
            title: 'Cerere în anulare formulată de debitor: %case%'
            message: 'Debitorul a formulat cerere în anulare împotriva ordonanței pe dosarul %case% (CPC art. 1024 alin. 1). Cererea nu suspendă executarea decât dacă instanța încuviințează suspendarea cu cauțiune (CPC art. 1024 alin. 5). Instanța soluționează cererea în complet de 2 judecători; nu mai e nevoie de acțiune din partea ta până la soluție.'
        anulare_admisa:
            title: 'Cerere în anulare admisă: %case%'
            message: 'Instanța a admis cererea în anulare formulată de debitor pe dosarul %case%. Ordonanța de plată a fost anulată și nu mai este titlu executoriu; hotărârea este definitivă (CPC art. 1024). Dacă executarea silită era pornită, verifică oprirea ei. Recuperarea pe calea dreptului comun nu este acoperită de aplicație.'
        anulare_respinsa:
            title: 'Cerere în anulare respinsă, ordonanță definitivă: %case%'
            message: 'Instanța a respins cererea în anulare formulată de debitor pe dosarul %case%. Hotărârea este definitivă (CPC art. 1024 alin. 8) și nu poate fi atacată cu apel. Ordonanța de plată rămâne titlu executoriu.'
        dosar_inregistrat:
            title: 'Dosar înregistrat: %case%'
            message: 'Cererea de ordonanță de plată a fost înregistrată la instanță și dosarul %case% a primit număr de dosar.'
        termen_fixat:
            title: 'Termen de judecată fixat: %case%'
            message: 'Instanța a fixat un termen de judecată pe dosarul %case%.'
        executare:
            title: 'Trecere la executare silită: %case%'
            message: 'Dosarul %case% a trecut la executare silită în baza titlului executoriu (ordonanța de plată definitivă).'
        executare_anulare_respinsa:
            title: 'Cerere în anulare respinsă, executarea continuă: %case%'
            message: 'Pe dosarul %case%, cererea în anulare a fost respinsă în timp ce executarea era deja pornită. Ordonanța rămâne titlu executoriu și executarea continuă (cererea în anulare nu suspendă executarea, CPC art. 1024 alin. 5; hotărârea de respingere este definitivă, alin. 8).'
        inchis_succes:
            title: 'Dosar închis cu recuperare: %case%'
            message: 'Dosarul %case% a fost închis cu succes: creanța a fost recuperată.'
        inchis_plata_integrala:
            title: 'Dosar închis, creanță achitată integral: %case%'
            message: 'Dosarul %case% a fost închis: creanța a fost achitată integral înainte de cererea de ordonanță de plată.'
        inchis_fara_recuperare:
            title: 'Dosar închis fără recuperare: %case%'
            message: 'Dosarul %case% a fost închis fără recuperarea creanței.'
    portal_event:
        title: 'Activitate portal: %case%'
        message: 'Activitate nouă pe portal pentru dosarul %case%.'
    portal_ruling_confirmation:
        title: 'Hotărâre pe portal, necesită confirmare'
        message: 'Pe dosarul %case% a fost detectată o hotărâre pe portal.just.ro care poate schimba statusul dosarului. Verifică soluția instanței și confirmă manual noul status.'
    portal_query_failed:
        title: 'Monitorizare portal oprită'
        message: 'Am oprit monitorizarea automată a dosarului %case% după 5 verificări eșuate consecutive pe portal.just.ro. Verifică numărul de dosar sau reactivează monitorizarea din dosar.'
    portal_case_found:
        title: 'Dosar găsit pe portal: %case%'
        message: 'Pe portal.just.ro apare dosarul %number%, care pare să fie cererea depusă pentru %case%. Verifică-l în tab-ul Portal și activează monitorizarea dacă este cel corect.'
    missing_communication_date:
        title: 'Completează data comunicării: %case%'
        message: 'Introdu data comunicării ordonanței pe dosarul %case% pentru a porni termenul cererii în anulare.'
    blocked_case:
        STAMP_DUTY_DUE:
            title: 'Achită taxa de timbru: %case%'
            message: 'Dosarul %case% are număr de dosar, iar taxa de timbru este încă neachitată. Taxa se plătește anticipat, deci nu aștepta înștiințarea de regularizare.'
        REGULARIZATION_NOTICE_DATE_MISSING:
            title: 'Data înștiințării de regularizare: %case%'
            message: 'Pe dosarul %case% taxa este amânată până la regularizare. Dacă ai primit înștiințarea de la instanță, introdu data comunicării ei ca să pornească termenul de 10 zile.'
        ENFORCEMENT_REGISTRATION_NUMBER_MISSING:
            title: 'Număr de înregistrare de la executor: %case%'
            message: 'Pe dosarul %case% cererea de executare figurează depusă, dar numărul de înregistrare de la executor lipsește. Introdu-l ca să se închidă termenul de prescripție a executării.'
    payment_failed:
        title: 'Reînnoirea abonamentului nu a putut fi încasată'
        message: 'Nu am reușit să încasăm automat abonamentul lunar. Cardul salvat a fost refuzat sau nu are fonduri suficiente. Actualizează metoda de plată și reia plata din contul tău.'
    token_expired:
        title: 'Cardul salvat pentru plata automată a expirat'
        message: 'Cardul salvat pentru plata automată a expirat, așa că nu am putut încasa abonamentul lunar. Reautorizează metoda de plată din contul tău.'
    payment_succeeded:
        title: 'Plata abonamentului a fost înregistrată'
        message: 'Am încasat cu succes abonamentul lunar, iar abonamentul tău a fost reînnoit. Nu trebuie să faci nimic.'
    invoice_issued:
        title: 'Factura ta este disponibilă'
        message: 'Factura pentru abonamentul tău a fost emisă și o poți descărca din secțiunea Facturi.'
    slot_overage:
        title: 'Dosar suplimentar facturat'
        message: 'Ai activat un dosar peste limita inclusă în abonament, așa că a fost generată o factură pentru dosarul suplimentar. O găsești în secțiunea Facturi.'

