    filing_receipt_overdue:
        title: 'Fără confirmare de primire: %case%'
        message: 'Nu a fost primită confirmare de primire în %days% zile lucrătoare de la transmitere. Lipsa confirmării nu arată că cererea nu a fost înregistrată; verificați înregistrarea la instanță. O confirmare primită pe altă cale se poate încărca pe cardul dosarului.'
    filing_bounced_permanent:
        address:
            title: 'E-mailul cu cererea a fost returnat: %case%'
            message: 'Serverul de e-mail al destinatarului a returnat definitiv e-mailul cu cererea (cod %code%), cu adresa raportată ca inexistentă. Nu este o respingere a instanței. Dosarul a revenit la cererea generată, iar adresa a fost raportată administratorului; rămâne în uz până la decizia lui, iar pentru acest dosar o nouă transmitere la aceeași adresă este blocată până atunci. %deadline% Aplicația nu prelungește termenul de 6 luni pentru menținerea întreruperii prescripției (NCC art. 2540). Dacă acest termen a trecut, somația nu mai întrerupe prescripția, iar cererea se poate depune în continuare cât timp prescripția nu s-a împlinit. Data de la care curge prescripția se verifică de avocat. Text provizoriu, în curs de validare juridică.'
        other:
            title: 'E-mailul cu cererea a fost returnat: %case%'
            message: 'Serverul de e-mail al destinatarului a returnat definitiv e-mailul cu cererea (cod %code%). Nu este o respingere a instanței; motivul poate fi o căsuță plină sau o regulă a serverului. Dosarul a revenit la cererea generată, iar adresa rămâne în uz. %deadline% Aplicația nu prelungește termenul de 6 luni pentru menținerea întreruperii prescripției (NCC art. 2540). Dacă acest termen a trecut, somația nu mai întrerupe prescripția, iar cererea se poate depune în continuare cât timp prescripția nu s-a împlinit. Data de la care curge prescripția se verifică de avocat. Text provizoriu, în curs de validare juridică.'
        size:
            title: 'E-mailul cu cererea a fost returnat pentru dimensiune: %case%'
            message: 'Serverul de e-mail al destinatarului a returnat e-mailul cu cererea din cauza dimensiunii (cod %code%). Nu este o respingere a instanței. Dosarul a revenit la cererea generată; anexele pot fi împărțite în volume mai mici, dacă este posibil. %deadline% Aplicația nu prelungește termenul de 6 luni pentru menținerea întreruperii prescripției (NCC art. 2540). Dacă acest termen a trecut, somația nu mai întrerupe prescripția, iar cererea se poate depune în continuare cât timp prescripția nu s-a împlinit. Data de la care curge prescripția se verifică de avocat. Text provizoriu, în curs de validare juridică.'
        annex:
            title: 'E-mail cu anexe returnat: %case%'
            message: 'Serverul de e-mail al destinatarului a returnat e-mailul %k% din %n% (cod %code%), după ce îl acceptase. Anexele din acest e-mail este posibil să nu fi ajuns la instanță. Transmiterea nu mai poate fi reluată automat; verificați situația și, dacă este cazul, depuneți anexele pe altă cale.'
    filing_delivery_delayed:
        title: 'Livrare întârziată: %case%'
        message: 'Un server de e-mail a raportat că livrarea e-mailului %k% din %n% este întârziată (cod %code%). Livrare întârziată; fără efect asupra stării transmiterii. Nimic nu este retrimis automat.'
    filing_cc_bounced:
        title: 'Copia în CC a fost returnată: %case%'
        message: 'Copia în CC trimisă avocatului a fost returnată (cod %code%). E-mailul către instanță nu este afectat. Verificați adresa de e-mail din profil.'
    filing_court_message:
        forwarded:
            title: 'Mesaj primit de la adresa instanței: %case%'
            message: 'Un mesaj primit pe adresa platformei (%date%) a fost redirecționat pe e-mailul avocatului. Adresa platformei nu este adresă procedurală: platforma nu primește comunicări procedurale și termenele nu curg de la primirea pe platformă. Verificați dosarul pe portal.just.ro și la registratură și răspundeți instanței de pe adresa proprie.'
        in_copy:
            title: 'Mesaj primit de la adresa instanței: %case%'
            message: 'Un mesaj primit pe adresa platformei (%date%) are avocatul deja în destinatari, deci nu a fost redirecționat. Adresa platformei nu este adresă procedurală: platforma nu primește comunicări procedurale și termenele nu curg de la primirea pe platformă. Verificați dosarul pe portal.just.ro și la registratură.'
    filing_late_bounce_review:
        title: 'Raport de nelivrare după avansarea dosarului: %case%'
        message: 'A sosit un raport de nelivrare pentru e-mailul cu cererea (cod %code%), dar dosarul arată deja că cererea ar fi putut ajunge la instanță. Nimic nu a fost anulat automat, iar e-mailurile rămase nu se mai trimit. Situația se verifică la instanță, apoi se confirmă pe cardul dosarului.'
    filing_inbound_review:
        title: 'Mesaj primit care necesită verificare: %case%'
        message: 'Un mesaj primit pe adresa platformei (%date%) pare să privească această transmitere, dar legătura nu este sigură. Posibilă potrivire, necesită confirmare; nu a fost aplicat nimic. Mesajul se poate descărca de pe cardul dosarului.'
    inbound_poll_stale:
        title: 'Căsuța de mesaje primite nu a fost citită'
        message: 'Ultima citire reușită a căsuței de mesaje primite: %since% (limită: %minutes% minute). Confirmările și răspunsurile instanțelor nu sunt preluate până la remediere.'
    filing_sent:
        title: 'Cerere transmisă instanței: %case%'
        message: 'Cererea a fost transmisă la adresa %address%; nu există încă o confirmare de primire.'
    filing_annexes_cancelled:
        title: 'Anexe netransmise: %case%'
        message: 'Au fost transmise doar: %sent%. Nu au fost transmise: %not_sent%. Anexele nu au fost trimise și trebuie depuse separat.'
    filing_failed_temporary:
        retrying:
            title: 'Trimiterea nu a funcționat: %case%'
            message: 'E-mailul %k% din %n% nu a fost acceptat de serverul destinatarului (eroare temporară, cod %code%). Se reîncearcă automat după 5 minute, 30 de minute și 2 ore; următoarea încercare: %next%. Retrimiterea automată nu garantează livrarea. Dacă un termen este aproape de expirare, verificați situația și, dacă este cazul, depuneți pe altă cale.'
        exhausted:
            title: 'Trimiterea nu a reușit după reîncercări: %case%'
            message: 'E-mailul %k% din %n% nu a fost acceptat de serverul destinatarului nici după reîncercările automate (ultimul cod: %code%). Nimic nu mai este trimis automat. Dacă un termen este aproape de expirare, verificați situația și, dacă este cazul, depuneți pe altă cale.'
    filing_failed_permanent:
        address:
            title: 'Trimiterea a fost refuzată: %case%'
            message: 'Serverul destinatarului a respins adresa (cod %code%). Adresa a fost scoasă din uz până la verificarea administratorului. Nimic nu a fost retrimis. Între timp, cererea se poate depune pe altă cale.'
        other:
            title: 'Trimiterea a fost refuzată: %case%'
            message: 'Serverul destinatarului a refuzat definitiv e-mailul %k% din %n% (cod %code%). Nimic nu a fost retrimis. Verificați situația și, dacă este cazul, depuneți pe altă cale.'
    filing_failed_size:
        resplit:
            title: 'E-mail refuzat pentru dimensiune: %case%'
            message: 'Serverul destinatarului a refuzat e-mailul %k% din %n% din cauza dimensiunii (cod %code%). Anexele pot fi împărțite în volume mai mici, care se semnează din nou înainte de o nouă transmitere.'
        other_channel:
            title: 'E-mail refuzat pentru dimensiune: %case%'
            message: 'Serverul destinatarului a refuzat e-mailul %k% din %n% din cauza dimensiunii (cod %code%). O nouă împărțire nu este disponibilă pentru acest e-mail. Verificați situația și, dacă este cazul, depuneți pe altă cale.'
    filing_failed_internal:
        title: 'Transmiterea s-a oprit: %case%'
        message: 'E-mailul %k% din %n% nu a fost trimis (eroare internă, de exemplu un fișier semnat lipsă sau modificat). Detaliile sunt pe cardul dosarului.'
    filing_needs_review:
        title: 'Transmiterea necesită verificare: %case%'
        message: '%reason%'
    filing_partially_sent:
        title: 'Cerere trimisă fără toate anexele: %case%'
        message: 'Cererea a fost acceptată de serverul destinatarului, dar e-mailul %k% din %n% nu a fost acceptat (%kind%, cod %code%). Nu toate anexele au fost acceptate de server. Pe cardul dosarului se pot retrimite e-mailurile rămase sau se poate închide transmiterea, cu depunerea anexelor pe altă cale.'
    deadline_alert:
        procedural:
            title: 'Termen %type% pe dosarul %case%'
            upcoming: 'Mai ai %days% zile până la termenul %type% (%date%).'
            expired: 'Termenul %type% (%date%) a expirat de %days% zile.'
        prescriptie:
            title: 'Prescripție pe dosarul %case%'
            upcoming: 'Mai ai %days% zile până la împlinirea termenului de prescripție (%date%). Termen neprorogabil (NCC art. 2517).'
            expired: 'Termenul de prescripție (%date%) s-a împlinit de %days% zile (NCC art. 2517).'
    case_status:
        somatie_trimisa:
            title: 'Somație generată: %case%'
            message: 'Somația de plată pentru dosarul %case% a fost generată. Termenul de 15 zile curge de la primirea de către debitor (CPC art. 1015 alin. 1).'
        cerere_generata:
            title: 'Cerere de OP gata: %case%'
            message: 'Pachetul cererii de ordonanță de plată pentru dosarul %case% este pregătit. După depunere, confirmă depunerea în dosar.'
        cerere_depusa:
            title: 'Depunere confirmată: %case%'
            message: 'Ai confirmat depunerea cererii de ordonanță de plată pe dosarul %case%.'
        ordonanta_emisa:
            title: 'Ordonanță emisă: %case%'
            message: 'Pe dosarul %case% a fost emisă ordonanța de plată. Termenul cererii în anulare este de 10 zile de la comunicare.'
        definitiva:
            title: 'Titlu executoriu: %case%'
            message: 'Ordonanța de plată pe dosarul %case% a rămas definitivă.'
        respinsa:
            title: 'Soluție nefavorabilă: %case%'
            message: 'Pe dosarul %case% instanța a pronunțat o soluție nefavorabilă.'
        in_anulare:
            title: 'Cerere în anulare formulată de debitor: %case%'
            message: 'Debitorul a formulat cerere în anulare împotriva ordonanței pe dosarul %case% (CPC art. 1024 alin. 1). Cererea nu suspendă executarea decât dacă instanța încuviințează suspendarea cu cauțiune (CPC art. 1024 alin. 5). Instanța soluționează cererea în complet de 2 judecători; nu mai e nevoie de acțiune din partea ta până la soluție.'
        anulare_admisa:
            title: 'Cerere în anulare admisă: %case%'
            message: 'Instanța a admis cererea în anulare formulată de debitor pe dosarul %case%. Ordonanța de plată a fost anulată și nu mai este titlu executoriu; hotărârea este definitivă (CPC art. 1024). Dacă executarea silită era pornită, verifică oprirea ei. Recuperarea pe calea dreptului comun nu este acoperită de aplicație.'
        anulare_respinsa:
            title: 'Cerere în anulare respinsă, ordonanță definitivă: %case%'
            message: 'Instanța a respins cererea în anulare formulată de debitor pe dosarul %case%. Hotărârea este definitivă (CPC art. 1024 alin. 8) și nu poate fi atacată cu apel. Ordonanța de plată rămâne titlu executoriu.'
        dosar_inregistrat:
            title: 'Dosar înregistrat: %case%'
            message: 'Cererea de ordonanță de plată a fost înregistrată la instanță și dosarul %case% a primit număr de dosar.'
        termen_fixat:
            title: 'Termen de judecată fixat: %case%'
            message: 'Instanța a fixat un termen de judecată pe dosarul %case%.'
        executare:
            title: 'Trecere la executare silită: %case%'
            message: 'Dosarul %case% a trecut la executare silită în baza titlului executoriu (ordonanța de plată definitivă).'
        executare_anulare_respinsa:
            title: 'Cerere în anulare respinsă, executarea continuă: %case%'
            message: 'Pe dosarul %case%, cererea în anulare a fost respinsă în timp ce executarea era deja pornită. Ordonanța rămâne titlu executoriu și executarea continuă (cererea în anulare nu suspendă executarea, CPC art. 1024 alin. 5; hotărârea de respingere este definitivă, alin. 8).'
        inchis_succes:
            title: 'Dosar închis cu recuperare: %case%'
            message: 'Dosarul %case% a fost închis cu succes: creanța a fost recuperată.'
        inchis_plata_integrala:
            title: 'Dosar închis, creanță achitată integral: %case%'
            message: 'Dosarul %case% a fost închis: creanța a fost achitată integral înainte de cererea de ordonanță de plată.'
        inchis_fara_recuperare:
            title: 'Dosar închis fără recuperare: %case%'
            message: 'Dosarul %case% a fost închis fără recuperarea creanței.'
    portal_event:
        title: 'Activitate portal: %case%'
        message: 'Activitate nouă pe portal pentru dosarul %case%.'
    portal_ruling_confirmation:
        title: 'Hotărâre pe portal, necesită confirmare'
        message: 'Pe dosarul %case% a fost detectată o hotărâre pe portal.just.ro care poate schimba statusul dosarului. Verifică soluția instanței și confirmă manual noul status.'
    portal_query_failed:
        title: 'Monitorizare portal oprită'
        message: 'Am oprit monitorizarea automată a dosarului %case% după 5 verificări eșuate consecutive pe portal.just.ro. Verifică numărul de dosar sau reactivează monitorizarea din dosar.'
    portal_case_found:
        title: 'Dosar găsit pe portal: %case%'
        message: 'Pe portal.just.ro apare dosarul %number%, care pare să fie cererea depusă pentru %case%. Verifică-l în tab-ul Portal și activează monitorizarea dacă este cel corect.'
    missing_communication_date:
        title: 'Completează data comunicării: %case%'
        message: 'Introdu data comunicării ordonanței pe dosarul %case% pentru a porni termenul cererii în anulare.'
    blocked_case:
        STAMP_DUTY_DUE:
            title: 'Taxa de timbru neachitată: %case%'
            message: 'Dosarul %case% are număr la instanță, iar taxa de timbru figurează ca neachitată. Taxa se plătește anticipat; dacă a fost deja achitată, plata se înregistrează în dosar.'
        REGULARIZATION_NOTICE_DATE_MISSING:
            title: 'Data înștiințării de regularizare: %case%'
            message: 'Pe dosarul %case% taxa este amânată până la regularizare. Dacă ai primit înștiințarea de la instanță, introdu data comunicării ei ca să pornească termenul de 10 zile.'
        ENFORCEMENT_REGISTRATION_NUMBER_MISSING:
            title: 'Număr de înregistrare de la executor: %case%'
            message: 'Pe dosarul %case% cererea de executare figurează depusă, dar numărul de înregistrare de la executor lipsește. Introdu-l ca să se închidă termenul de prescripție a executării.'
    payment_failed:
        title: 'Reînnoirea abonamentului nu a putut fi încasată'
        message: 'Nu am reușit să încasăm automat abonamentul lunar. Cardul salvat a fost refuzat sau nu are fonduri suficiente. Actualizează metoda de plată și reia plata din contul tău.'
    token_expired:
        title: 'Cardul salvat pentru plata automată a expirat'
        message: 'Cardul salvat pentru plata automată a expirat, așa că nu am putut încasa abonamentul lunar. Reautorizează metoda de plată din contul tău.'
    payment_succeeded:
        title: 'Plata abonamentului a fost înregistrată'
        message: 'Am încasat cu succes abonamentul lunar, iar abonamentul tău a fost reînnoit. Nu trebuie să faci nimic.'
    invoice_issued:
        title: 'Factura ta este disponibilă'
        message: 'Factura pentru abonamentul tău a fost emisă și o poți descărca din secțiunea Facturi.'
    slot_overage:
        title: 'Dosar suplimentar facturat'
        message: 'Ai activat un dosar peste limita inclusă în abonament, așa că a fost generată o factură pentru dosarul suplimentar. O găsești în secțiunea Facturi.'

