            state: 'Fără dată de pornire'
            cause: 'Dosarul este definitiv, dar nici data comunicării ordonanței, nici data pronunțării nu sunt introduse.'
            consequence: 'Termenul nu se creează: orice dată pe care ar folosi-o aplicația ar fi ulterioară celei reale, deci ar arăta un termen mai lung decât cel care curge efectiv. Până introduci una dintre cele două date, prescripția executării nu este urmărită.'
            action: 'Introdu data comunicării hotărârii'
        ENFORCEMENT_REGISTRATION_NUMBER_MISSING:
            label: 'Lipsește numărul de înregistrare de la executor'
            missing: 'Închiderea prescripției executării'
            legal_basis: 'CPC art. 705 alin. 1'
