        body: 'Pe dosarul %case% a fost detectată o activitate nouă pe portal.just.ro.'
    missing_communication_date:
        subject: 'Completează data comunicării pentru dosarul %case%'
        heading: 'Completează data comunicării ordonanței'
        body: 'Pentru a porni termenul de 10 zile al cererii în anulare (CPC art. 1024 alin. 1), introdu în dosarul %case% data comunicării ordonanței către debitor. Fără această dată, dosarul nu poate fi marcat definitiv automat.'
    # Alerte pentru dosarele blocate pe un act, fără niciun termen care să curgă.
    # Formularea de la regularizare este condiționată intenționat: platforma nu are
    # cum să știe dacă înștiințarea a sosit, singura ei dovadă ar fi chiar data pe
    # care o cere.
    blocked_case:
        missing_label: 'Ce lipsește:'
        action_label: 'Ce ai de făcut:'
        STAMP_DUTY_DUE:
            subject: 'Achită taxa de timbru pentru dosarul %case%'
            heading: 'Dosarul are număr, taxa de timbru se achită acum'
            body: 'Dosarul %case% are număr de dosar la instanță, iar taxa de timbru este încă înregistrată ca neachitată. Taxa se plătește anticipat (OUG 80/2013 art. 33 alin. 1), deci nu aștepta înștiințarea de regularizare. După plată, încarcă dovada în dosar.'
            missing: 'Dovada plății taxei de timbru pe dosarul %case%.'
            action: 'Achită taxa, apoi încarcă dovada în dosar și marchează taxa ca achitată.'
        REGULARIZATION_NOTICE_DATE_MISSING:
            subject: 'Dosarul %case% așteaptă data înștiințării de regularizare'
            heading: 'Dacă ai primit înștiințarea, introdu data'
            body: 'Pe dosarul %case% taxa de timbru este amânată până la regularizare, iar data înștiințării nu este introdusă. Dacă ai primit înștiințarea de la instanță, introdu data comunicării ei: de la acea dată curg cele 10 zile de timbrare (OUG 80/2013 art. 33 alin. 2), iar ratarea lor atrage anularea cererii.'
            missing: 'Data comunicării înștiințării de regularizare pe dosarul %case%.'
            action: 'Dacă ai primit înștiințarea, deschide dosarul și introdu data comunicării ei, ca să pornească termenul de 10 zile.'
        ENFORCEMENT_REGISTRATION_NUMBER_MISSING:
            subject: 'Dosarul %case% așteaptă numărul de înregistrare de la executor'
            heading: 'Cere executorului numărul de înregistrare'
            body: 'Pe dosarul %case% ai declarat că ai depus cererea de executare, dar numărul de înregistrare primit de la executor nu este introdus. Numărul închide termenul de 3 ani al prescripției executării, calculat tot de la data depunerii (CPC art. 708 alin. 1 pct. 2). Până atunci termenul rămâne deschis, fără alerte. Acesta este singurul mesaj pe care îl primești pe subiectul ăsta; dosarul rămâne în zona de blocaje cât timp numărul lipsește.'
            missing: 'Numărul de înregistrare al cererii de executare pe dosarul %case%.'
            action: 'Cere executorului numărul, apoi deschide dosarul și introdu-l în fila Termene.'

