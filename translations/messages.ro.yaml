        somatie_trimisa:
            subject: 'Somație generată pentru dosarul %case%'
            heading: 'Somația de plată a fost generată'
            body: 'Somația de plată pentru dosarul %case% a fost generată. Comunic-o debitorului și încarcă dovada comunicării. Termenul de 15 zile pentru plată curge de la primirea somației de către debitor (CPC art. 1015 alin. 1).'
        cerere_generata:
            subject: 'Cererea de ordonanță de plată este gata pentru dosarul %case%'
            heading: 'Cererea de ordonanță de plată este gata'
            body: 'Pachetul cererii de ordonanță de plată pentru dosarul %case% este pregătit. Descarcă arhiva, depune cererea la instanță, apoi confirmă depunerea în platformă.'
        cerere_depusa:
            subject: 'Depunerea a fost confirmată pentru dosarul %case%'
            heading: 'Cererea a fost depusă la instanță'
            body: 'Ai confirmat depunerea cererii de ordonanță de plată pe dosarul %case%. Urmează înregistrarea pe rolul instanței. Când afli numărul de dosar, introdu-l în platformă ca să pornească monitorizarea.'
        ordonanta_emisa:
            subject: 'Ordonanță de plată emisă pe dosarul %case%'
            heading: 'Instanța a emis ordonanța de plată'
            body: 'Pe dosarul %case% a fost emisă ordonanța de plată. Termenul cererii în anulare este de 10 zile și curge de la data comunicării ordonanței către debitor (CPC art. 1024 alin. 1). Completează data comunicării în dosar pentru a porni termenul.'
        definitiva:
            subject: 'Titlu executoriu obținut pe dosarul %case%'
            heading: 'Ordonanța de plată a rămas definitivă'
            body: 'Ordonanța de plată pe dosarul %case% a rămas definitivă și constituie titlu executoriu. Poți trece la executarea silită.'
        respinsa:
            subject: 'Soluție nefavorabilă pe dosarul %case%'
            heading: 'Soluție nefavorabilă pe dosar'
            body: 'Pe dosarul %case% instanța a pronunțat o soluție nefavorabilă (cerere de ordonanță de plată respinsă sau cerere în anulare admisă). Verifică soluția instanței și termenele aplicabile.'
        in_anulare:
            subject: 'Cerere în anulare pe dosarul %case%'
            heading: 'Debitorul a formulat cerere în anulare'
            body: 'Debitorul a formulat cerere în anulare împotriva ordonanței pe dosarul %case% (CPC art. 1024 alin. 1). Cererea nu suspendă executarea decât dacă instanța încuviințează suspendarea cu cauțiune (CPC art. 1024 alin. 5). Cererea se soluționează în complet de 2 judecători, fără o acțiune suplimentară din partea ta până la soluție.'
        anulare_admisa:
            subject: 'Cerere în anulare admisă pe dosarul %case%'
            heading: 'Instanța a admis cererea în anulare'
            body: 'Instanța a admis cererea în anulare pe dosarul %case%. Ordonanța de plată a fost anulată și nu mai este titlu executoriu, iar hotărârea este definitivă (CPC art. 1024). Dacă executarea silită era pornită, verifică oprirea ei. Recuperarea pe calea dreptului comun nu este acoperită de aplicație.'
        anulare_respinsa:
            subject: 'Ordonanță definitivă pe dosarul %case%'
            heading: 'Cererea în anulare a fost respinsă'
            body: 'Instanța a respins cererea în anulare pe dosarul %case%. Hotărârea este definitivă (CPC art. 1024 alin. 8) și nu poate fi atacată cu apel, iar ordonanța de plată rămâne titlu executoriu.'
        dosar_inregistrat:
