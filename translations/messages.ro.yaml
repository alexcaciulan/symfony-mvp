        reason_charge_failed: 'Nu am reușit să încasăm automat abonamentul lunar. Cardul salvat a fost refuzat sau nu are fonduri suficiente.'
        reason_token_expired: 'Cardul salvat pentru plata automată a expirat, așa că nu am putut încasa abonamentul lunar.'
        instruction: 'Pentru a păstra abonamentul activ, actualizează metoda de plată și reia plata din contul tău.'
        cta: 'Actualizează plata'
