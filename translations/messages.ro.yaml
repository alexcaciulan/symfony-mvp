        art99_divergent_competence: 'Pretențiile se întemeiază pe %causes% cauze diferite, iar competența nu iese aceeași pentru fiecare (CPC art. 99 alin. 1, evaluare separată pe fiecare pretenție). Depune cereri distincte sau alege manual instanța, după ce verifici încadrarea fiecărei pretenții.'
        art99_cause_unattributable: 'Dosarul conține mai multe cauze (%causes%), iar unele poziții nu arată din ce contract izvorăsc. Completează cauza fiecărei poziții la pasul 3 sau alege manual instanța: gruparea decide competența materială, care este de ordine publică (CPC art. 99).'

# =============================================================================
# Admisibilitate cerere ordonanță de plată (CPC art. 1014 + Legea 85/2014)
# Mesaje pentru OpAdmissibilityValidator — afișate în wizard / blocaj PDF.
# =============================================================================
validation:
    op_admissibility:
        OP_BLOCKED_DEREGISTERED: 'Debitorul este radiat din ANAF și nu mai are personalitate juridică, cererea OP este inadmisibilă. Verifică actele în Registrul Comerțului.'
        OP_BLOCKED_INSOLVENCY: 'Debitorul este în procedura insolvenței (Legea 85/2014). Creanța se înscrie la masa credală, nu se recuperează prin ordonanță de plată.'
        OP_DEFENDANT_FISCALLY_INACTIVE: 'Debitorul este declarat inactiv fiscal de ANAF. Cererea OP rămâne admisibilă, dar șansele de recuperare sunt reduse.'
        OP_ANAF_NOT_VERIFIED: 'Statusul ANAF al debitorului nu a fost verificat. Apelează ANAF pe baza CUI înainte de depunere.'
        OP_ANAF_STALE: 'Verificarea ANAF e mai veche de 30 de zile. Reverifică statusul fiscal înainte de depunere.'
        OP_INSOLVENCY_NOT_VERIFIED: 'Nu ai confirmat că debitorul nu se află în procedurile prevăzute de Legea 85/2014. Revino la pasul Debitor și bifează confirmarea înainte de depunere.'
        OP_INSOLVENCY_STALE: 'Verificarea privind procedurile prevăzute de Legea 85/2014 este mai veche de 7 zile, iar situația se poate schimba rapid. Reverifică debitorul, apoi la pasul Debitor debifează confirmarea, salvează și bifeaz-o din nou.'
        OP_PF_BIPF_MANUAL_CHECK: 'Debitor persoană fizică: verifică manual, înainte de depunere, dacă debitorul nu se află în procedurile prevăzute de Legea 151/2015.'
        OP_ITEM_NOT_YET_DUE: 'O poziție de creanță are scadența în viitor. Creanța nu este exigibilă (CPC art. 1014), iar cererea de ordonanță de plată este inadmisibilă pentru acea sumă. Corectează scadența, exclude poziția sau așteaptă împlinirea termenului.'
        OP_ITEM_DUE_DATE_MISSING: 'O poziție de creanță nu are scadență. Fără scadență nu se poate proba exigibilitatea și nu se calculează dobânda. Completează data sau exclude poziția.'
        OP_ITEM_PRESCRIBED: 'O poziție de creanță are scadența mai veche de 3 ani, deci termenul de prescripție pare împlinit (C. civ. art. 2517, care curge de la scadența fiecărei facturi). Instanța NU aplică prescripția din oficiu (art. 2512), dar debitorul o poate invoca, iar în procedura ordonanței de plată o apărare care cere probe suplimentare poate atrage respingerea cererii, creditorul fiind îndrumat spre dreptul comun (CPC art. 1021 alin. 2). Decide expres dacă păstrezi acest capăt.'
        OP_ITEM_UNIMPUTED_PAYMENT: 'O poziție de creanță are o plată înregistrată care nu a fost imputată. Suma cerută rămâne cea facturată, pentru că imputația se face după C. civ. art. 1507-1509 și este decizia ta. Verifică dacă suma solicitată mai este certă (CPC art. 1014 alin. 1).'
        OP_ITEM_STATED_DEDUCTION: 'O poziție de creanță menționează în descriere un scăzământ (avans, reținere de garanție, plată parțială). Suma cerută este totalul facturat, nu diferența. Verifică documentul și, dacă este cazul, corectează poziția înainte de depunere: o creanță parțial încasată nu este certă (CPC art. 1014 alin. 1).'
        OP_BALANCE_BELOW_INVOICES: 'Soldul din fișa de cont sau din confirmarea de sold este mai mic decât totalul facturilor din dosar. Diferența poate reprezenta plăți deja încasate, dar și compensări sau stornări. Suma cerută rămâne cea facturată: verifică dacă mai este certă (CPC art. 1014 alin. 1) și corectează pozițiile achitate (imputația plății o faci tu, C. civ. art. 1507-1509).'
        OP_PENALTY_EXCEEDS_PRINCIPAL: 'Penalitățile contractuale (%penalty% lei) depășesc debitul principal (%principal% lei). Depășirea principalului nu e un prag legal, dar e un semn de verificat: instanța poate reduce penalitatea dacă o găsește vădit excesivă față de prejudiciul ce putea fi prevăzut la încheierea contractului (C. civ. art. 1541 alin. 1 lit. b), iar o apărare a debitorului pe acest temei poate duce la respingerea cererii, cu îndrumarea creditorului spre dreptul comun (CPC art. 1021 alin. 2). Decide dacă ceri integral suma.'
        OP_DEBT_NOT_YET_DUE: 'Scadența creanței este în viitor. Creanța nu este exigibilă (CPC art. 1014), iar cererea de ordonanță de plată este inadmisibilă: nu se poate solicita plata înainte de scadență. Corectează data scadenței sau așteaptă împlinirea termenului.'

