            consequence: 'Cererea de ordonanță nu se poate genera fără dovadă: dovada comunicării se atașează cererii sub sancțiunea respingerii ei ca inadmisibilă, iar instanței i se prezintă recipisa executorului sau confirmarea de primire, nu data declarată de tine. Atașează dovada acum, cât mai poți cere executorului sau poștei o copie, nu în ziua în care trebuie depus pachetul.'
            action: 'Încarcă dovada comunicării'
