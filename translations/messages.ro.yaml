            missing: 'Cererea în anulare, 10 zile'
            legal_basis: 'CPC art. 1024 alin. 1'
            state: 'În curs de comunicare'
            cause: 'Ordonanța a fost emisă, dar data comunicării hotărârii nu este introdusă.'
            consequence: 'Termenul este de decădere. Fără dată, nu se creează și nu generează nicio alertă.'
            action: 'Introdu data comunicării ordonanței'
        STAMP_DUTY_NOTICE_MISSING:
            label: 'Data înștiințării de timbrare nu este introdusă'
            missing: 'Timbrarea, 10 zile'
            legal_basis: 'OUG 80/2013 art. 33 alin. 2'
            state: 'Se așteaptă înștiințarea'
            cause: 'Cererea este depusă cu taxa neachitată sau amânată la regularizare, dar data înștiințării de timbrare nu este introdusă.'
            consequence: 'Netimbrarea în termenul acordat de instanță atrage anularea cererii.'
            action: 'Introdu data înștiințării'
        ANNULMENT_RULING_COMMUNICATION_MISSING:
            label: 'Lipsește data comunicării hotărârii din cererea în anulare'
            missing: 'Prescripția executării, 3 ani'
            legal_basis: 'CPC art. 705 alin. 2 raportat la art. 1024 alin. 8'
            state: 'În curs de comunicare'
            cause: 'Pe dosar s-a formulat cerere în anulare, iar ordonanța a devenit definitivă prin soluționarea ei. Data comunicării acelei hotărâri nu este introdusă.'
