        locality_ambiguous: 'Localitatea se potrivește cu mai multe judecătorii. Alege manual instanța corectă.'
        matched_judecatorie: 'Judecătorie competentă conform CPC art. 94 + 107 (raza teritorială).'
        matched_tribunal: 'Tribunal competent conform CPC art. 95 (principalul depășește pragul de 200.000 RON). Accesoriile (dobânzi, penalități) nu intră în calculul competenței, conform CPC art. 98 alin. 2.'
        matched_tribunal_specializat: 'Tribunal specializat competent pentru litigii între profesioniști (Legea 304/2022 art. 41). Verifică practica instanței înainte de depunere.'
        tribunal_missing: 'Niciun tribunal activ în județul %county%. Contactează administratorul.'
