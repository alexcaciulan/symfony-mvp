<!DOCTYPE html>
<html lang="ro" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — LexRecovery Mockup</title>
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { 'lex-navy': '#1E3A5F', 'lex-navy-dark': '#162A45' },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
      }}
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-slate-100 dark:from-slate-950 dark:via-slate-900 dark:to-lex-navy-dark text-slate-900 dark:text-slate-100">

<div class="absolute top-4 right-4">
  <button onclick="toggleTheme()" class="p-2 rounded-lg bg-white/80 dark:bg-slate-800/80 backdrop-blur hover:bg-white dark:hover:bg-slate-800 shadow-sm" aria-label="Toggle dark mode">
    <svg class="w-5 h-5 dark:hidden text-slate-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    <svg class="w-5 h-5 hidden dark:block text-slate-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
  </button>
</div>

<main class="min-h-screen flex flex-col items-center justify-center px-4 py-12">

  <div class="flex flex-col items-center gap-3 mb-8 text-center">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-lex-navy text-white shadow-lg">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16l-3-3m3 3l3-3"/></svg>
    </div>
    <h1 class="text-3xl font-bold tracking-tight text-lex-navy dark:text-white">LexRecovery</h1>
    <p class="text-sm text-slate-600 dark:text-slate-400 max-w-sm">Recuperare creanțe automatizată pentru avocați — somație, ordonanță de plată, monitorizare instanță.</p>
  </div>

  <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-8">
    <h2 class="text-xl font-semibold text-slate-900 dark:text-white mb-6">Conectează-te</h2>

    <form class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
        <input id="email" type="email" value="mihai.ionescu@cabinet-ionescu.ro" autocomplete="email"
               class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Parolă</label>
          <a href="#" class="text-xs font-medium text-blue-600 dark:text-blue-400 hover:underline">Ai uitat parola?</a>
        </div>
        <input id="password" type="password" value="••••••••••" autocomplete="current-password"
               class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>

      <label class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400">
        <input type="checkbox" checked class="w-4 h-4 rounded border-slate-300 dark:border-slate-600 text-blue-600 focus:ring-blue-500 bg-white dark:bg-slate-800">
        Ține-mă conectat 30 zile
      </label>

      <button type="button" class="w-full mt-2 px-4 py-2.5 rounded-lg bg-lex-navy text-white font-semibold hover:bg-lex-navy-dark transition shadow-sm">
        Conectează-te
      </button>
    </form>

    <div class="my-6 flex items-center gap-3">
      <div class="flex-1 h-px bg-slate-200 dark:bg-slate-800"></div>
      <span class="text-xs text-slate-400">sau</span>
      <div class="flex-1 h-px bg-slate-200 dark:bg-slate-800"></div>
    </div>

    <p class="text-center text-sm text-slate-600 dark:text-slate-400">
      Cont nou?
      <a href="#" class="font-medium text-blue-600 dark:text-blue-400 hover:underline">Creează unul aici →</a>
    </p>
  </div>

  <div class="mt-8 flex items-center gap-4 text-xs text-slate-400">
    <span>v1.0 MVP</span>
    <span>•</span>
    <a href="#" class="hover:text-slate-600 dark:hover:text-slate-300">Termeni</a>
    <a href="#" class="hover:text-slate-600 dark:hover:text-slate-300">GDPR</a>
    <a href="../index.html" class="hover:text-slate-600 dark:hover:text-slate-300">← Înapoi la galerie</a>
  </div>
</main>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }
</script>
</body>
</html>
