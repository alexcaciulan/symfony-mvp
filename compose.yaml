
# YAML anchor — both `php` (FPM) and `worker` (messenger:consume) share the
# same image, working dir, mounts, and env. Defining once via &php_base avoids
# drift between the two services as we add new env vars (ANTHROPIC_API_KEY,
# OCR_LANGUAGES, etc.).
x-php-base: &php_base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  environment: &php_env
    APP_ENV: ${APP_ENV:-dev}
    APP_SECRET: ${APP_SECRET}
    DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app_password}@database:3306/${MYSQL_DATABASE:-symfony_mvp}?serverVersion=${MYSQL_VERSION:-8.0}&charset=utf8mb4
    MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    MAILER_DSN: smtp://mailer:1025
  depends_on:
    database:
      condition: service_healthy
  networks:
    - symfony-network

services:
  php:
    <<: *php_base
    container_name: symfony-mvp-php

  worker:
    <<: *php_base
    container_name: symfony-mvp-worker
    # Override the FPM entrypoint — we don't serve HTTP, we drain the async
    # messenger queue. `--time-limit=3600` forces a graceful restart hourly
    # to shed any PHP memory leaks accumulated during long Anthropic-heavy
    # extractions; `--memory-limit=128M` is the safety net if that happens
    # before the time-limit. Logs land on stdout/stderr (-vv), captured by
    # Docker — no separate file destination.
    entrypoint: []
    command:
      - sh
      - -c
      - |
        # Wait until the database is reachable AND the main `php` container has
        # finished applying migrations (it owns `make migrate` in dev).
        # `doctrine:migrations:up-to-date` exits 0 when the schema matches the
        # latest migration and ≠ 0 otherwise — the cheapest portable probe
        # that doesn't depend on a specific table name.
        until php bin/console doctrine:migrations:up-to-date >/dev/null 2>&1; do
          echo "worker: waiting for migrations to be applied..."
          sleep 3
        done
        echo "worker: starting messenger:consume async"
        exec php bin/console messenger:consume async \
            --time-limit=3600 --memory-limit=128M -vv

  nginx:
    image: nginx:alpine
    container_name: symfony-mvp-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - symfony-network

###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-8.0}
    container_name: symfony-mvp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-symfony_mvp}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - symfony-network
###< doctrine/doctrine-bundle ###

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    container_name: symfony-mvp-mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisInProd!aMinimum32CharsSecret!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisInProd!aMinimum32CharsSecret!'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8080 http://127.0.0.1:8080
        anonymous
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    networks:
      - symfony-network
###< symfony/mercure-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
  vendor:

networks:
  symfony-network:
    driver: bridge
