server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    client_max_body_size 22M;

    # Mercure served same-origin so the public demo needs a single tunnel and
    # the browser never hits a cross-origin SSE endpoint.
    location /.well-known/mercure {
        proxy_pass http://mercure:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Static design mockups from the docs, behind basic auth: the demo is public,
    # the mockups show unreleased screens. The password file is written by
    # scripts/demo.sh from DEMO_MOCKUPS_AUTH (or DEMO_MAIL_AUTH); an empty file
    # refuses everyone.
    location = /mockups {
        return 301 /mockups/;
    }

    location ^~ /mockups/ {
        alias /var/www/html/docs/LexRecovery/mockups/;
        index index.html;
        auth_basic "LexRecovery mockups";
        auth_basic_user_file /etc/nginx/mockups.htpasswd;
        location ~ \.md$ {
            return 404;
        }
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Resolved per request through Docker's DNS: a recreated php container gets a
        # new IP, and an address cached at nginx start would answer 502 until restart.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
