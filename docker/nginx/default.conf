server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    client_max_body_size 22M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Resolved per request through Docker's DNS: a recreated php container gets a
        # new IP, and an address cached at nginx start would answer 502 until restart.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        # The filing package build compresses and merges PDFs; its own budget is 100 s.
        fastcgi_read_timeout 120s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}