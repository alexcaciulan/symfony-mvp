framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Async so the request never blocks on SMTP and the forgot-password
            # existing-user branch is no slower than not-found (closes an enumeration
            # timing channel). Test env overrides back to sync for MailerAssertions.
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # LexRecovery — Pas 2.6: extracție async pentru documente uploadate.
            # Handler at App\MessageHandler\ExtractDataMessageHandler invokes the
            # 4-tier cascade in a worker process; HTTP request returns ~50ms.
            App\Message\ExtractDataMessage: async

            # Per-case portal.just.ro check, staggered from `app:portal-check-all`.
            # Async so a transient SOAP failure is retried (retry_strategy above:
            # max 3, x2 backoff).
            App\Message\CheckCasePortalMessage: async

            # Issue the fiscal invoice through the external provider (Oblio/SmartBill)
            # after a payment, off the checkout request. Transient provider failures
            # are retried; business failures are parked by the handler.
            App\Message\IssueFiscalInvoiceMessage: async

            # Settle a verified Netopia IPN off the webhook request. Idempotent
            # handler (only settles a PENDING invoice), so the retry_strategy
            # retries transient DB failures safely without double-settling.
            App\Message\ProcessPaymentWebhookMessage: async
