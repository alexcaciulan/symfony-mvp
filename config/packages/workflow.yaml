framework:
    workflows:
        legal_case:
            type: state_machine
            audit_trail:
                enabled: true
            marking_store:
                service: App\Workflow\MarkingStore\EnumMarkingStore
            supports:
                - App\Entity\LegalCase
            initial_marking: AMIABIL
            places:
                - AMIABIL
                - SOMATIE_TRIMISA
                - CERERE_DEPUSA
                - DOSAR_INREGISTRAT
                - TERMEN_FIXAT
                - ORDONANTA_EMISA
                - IN_ANULARE
                - DEFINITIVA
                - EXECUTARE
                - RESPINSA
                - INCHIS_SUCCES
                - INCHIS_FARA_RECUPERARE
            transitions:
                trimite_somatie:
                    from: AMIABIL
                    to: SOMATIE_TRIMISA
                depune_cerere:
                    from: SOMATIE_TRIMISA
                    to: CERERE_DEPUSA
                inregistreaza_dosar:
                    from: CERERE_DEPUSA
                    to: DOSAR_INREGISTRAT
                fixeaza_termen:
                    from: DOSAR_INREGISTRAT
                    to: TERMEN_FIXAT
                emite_ordonanta:
                    from: TERMEN_FIXAT
                    to: ORDONANTA_EMISA
                respinge:
                    from: TERMEN_FIXAT
                    to: RESPINSA
                formuleaza_cerere_anulare:
                    from: ORDONANTA_EMISA
                    to: IN_ANULARE
                marcheaza_definitiva:
                    from: ORDONANTA_EMISA
                    to: DEFINITIVA
                respinge_cerere_anulare:
                    from: IN_ANULARE
                    to: DEFINITIVA
                # Annulment rejected while enforcement is already running: the order
                # stands and enforcement continues, so this records the outcome
                # without leaving EXECUTARE (a single-marking machine cannot be both
                # in EXECUTARE and back in DEFINITIVA).
                respinge_cerere_anulare_executare:
                    from: EXECUTARE
                    to: EXECUTARE
                admite_cerere_anulare:
                    from: [IN_ANULARE, EXECUTARE]
                    to: RESPINSA
                trece_la_executare:
                    from: [ORDONANTA_EMISA, IN_ANULARE, DEFINITIVA]
                    to: EXECUTARE
                inchide_succes:
                    from: [DEFINITIVA, EXECUTARE]
                    to: INCHIS_SUCCES
                inchide_fara_recuperare:
                    from: [DEFINITIVA, EXECUTARE]
                    to: INCHIS_FARA_RECUPERARE
