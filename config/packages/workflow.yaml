framework:
    workflows:
        legal_case:
            type: state_machine
            audit_trail:
                enabled: true
            marking_store:
                service: App\Workflow\MarkingStore\EnumMarkingStore
            supports:
                - App\Entity\LegalCase
            initial_marking: AMIABIL
            places:
                - AMIABIL
                - SOMATIE_TRIMISA
                - CERERE_DEPUSA
                - DOSAR_INREGISTRAT
                - TERMEN_FIXAT
                - ORDONANTA_EMISA
                - CONTESTATA
                - DEFINITIVA
                - EXECUTARE
                - RESPINSA
                - INCHIS_SUCCES
                - INCHIS_PARTIAL_INSOLVABIL
            transitions:
                trimite_somatie:
                    from: AMIABIL
                    to: SOMATIE_TRIMISA
                depune_cerere:
                    from: SOMATIE_TRIMISA
                    to: CERERE_DEPUSA
                inregistreaza_dosar:
                    from: CERERE_DEPUSA
                    to: DOSAR_INREGISTRAT
                fixeaza_termen:
                    from: DOSAR_INREGISTRAT
                    to: TERMEN_FIXAT
                emite_ordonanta:
                    from: TERMEN_FIXAT
                    to: ORDONANTA_EMISA
                respinge:
                    from: TERMEN_FIXAT
                    to: RESPINSA
                contesta:
                    from: ORDONANTA_EMISA
                    to: CONTESTATA
                marcheaza_definitiva:
                    from: ORDONANTA_EMISA
                    to: DEFINITIVA
                respinge_contestatie:
                    from: CONTESTATA
                    to: DEFINITIVA
                admite_contestatie:
                    from: CONTESTATA
                    to: RESPINSA
                inchide_succes:
                    from: DEFINITIVA
                    to: INCHIS_SUCCES
                inchide_insolvabil:
                    from: DEFINITIVA
                    to: INCHIS_PARTIAL_INSOLVABIL
