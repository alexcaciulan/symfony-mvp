security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # Blocks soft-deleted accounts at authentication (email verification is
            # gated separately at request time by EmailVerificationSubscriber).
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                # With no saved target path (direct login, post email-verification),
                # land on the dashboard instead of the marketing home at `/`.
                default_target_path: app_dashboard
            login_throttling:
                # Custom limiter adds a per-username tier (audit #16); thresholds live in
                # rate_limiter.yaml (login_global / login_local / login_username).
                limiter: App\Security\LoginRateLimiter
            logout:
                path: app_logout
                enable_csrf: true
                # where to redirect after logout
                # target: app_any_route

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # Only the *first* matching rule applies. Genuinely public routes are
        # enumerated first, then a trailing `^/` catch-all makes the firewall
        # deny-by-default: any un-prefixed sensitive route (a future /reports,
        # /export, ...) requires authentication even if a dev forgets #[IsGranted].

        # Public server-to-server IPN callback (no user session, no CSRF).
        - { path: '^/webhook', roles: PUBLIC_ACCESS }
        # Public auth + onboarding surface.
        - { path: '^/$', roles: PUBLIC_ACCESS }
        - { path: '^/login', roles: PUBLIC_ACCESS }
        - { path: '^/logout', roles: PUBLIC_ACCESS }
        - { path: '^/register', roles: PUBLIC_ACCESS }
        - { path: '^/verify/email', roles: PUBLIC_ACCESS }
        - { path: '^/forgot-password', roles: PUBLIC_ACCESS }
        - { path: '^/reset-password', roles: PUBLIC_ACCESS }
        - { path: '^/switch-locale', roles: PUBLIC_ACCESS }

        - { path: '^/admin', roles: ROLE_ADMIN }
        - { path: '^/api', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/case', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/dashboard', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/profile', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/subscription', roles: IS_AUTHENTICATED_FULLY }

        # Deny-by-default: everything not matched above needs a full session.
        - { path: '^/', roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
