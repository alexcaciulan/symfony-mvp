framework:
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        # Generous per-request budget consumed on every POST /register, so replaying an
        # invalid-but-expensive submission (which still runs the NotCompromisedPassword breach
        # lookup) is bounded. The strict `registration` limit above only counts valid submissions.
        registration_attempt:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        forgot_password:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        case_creation:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        document_upload:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Traffic ceiling for the upload endpoints, charged per file received even
        # when the file is skipped as an already known one. The budget above only
        # counts files that are really stored and extracted.
        document_upload_request:
            policy: sliding_window
            limit: 60
            interval: '1 hour'
        company_lookup:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        summons_generation:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        payment_order_generation:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Manual portal.just.ro check (Pas 6.1 CasePortalController::checkNow) —
        # SOAP I/O extern la cerere; limitează abuzul de butonul „Verifică acum".
        portal_check:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Auto-discovery search on portal.just.ro (CasePortalController::discover) —
        # SOAP party search to find a case before its ECRIS number is known. One
        # search may fan out to several SOAP calls (one per debtor), so keep it tight.
        portal_search:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # AI extraction limiters — per-user (consumed by Pas 2.5.7 OcrTextStrategy
        # + Pas 2.5.8 AiVisionStrategy, NOT by AnthropicApiClient itself).
        # Daily windows reflect typical lawyer-volume + Anthropic pricing tiers.
        extraction_ai_text:
            policy: sliding_window
            limit: 200
            interval: '1 day'
        # Daily budget aligned with extraction_ai_text. 50/day capped a lawyer at
        # 5-10 cases and bit exactly on the onboarding day, when a whole
        # portfolio gets uploaded at once. Note the file-size and MIME guards run
        # BEFORE the limiter, so a rejected file does not spend a token here;
        # only calls that actually reach the model count.
        extraction_ai_vision:
            policy: sliding_window
            limit: 200
            interval: '1 day'
        # Anti-burst companion to the daily budget: bounds a runaway loop or a
        # scripted flood without touching the legitimate onboarding pattern
        # (10 documents per case, uploaded a case at a time).
        extraction_ai_vision_burst:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
        # Server-side table data endpoint (TableController). Generous per-user
        # window: filtering/sorting/paging fire one request each.
        table_data:
            policy: sliding_window
            limit: 600
            interval: '1 hour'
        # Subscribe + checkout POSTs (SubscriptionController) — per user; prevents
        # spamming pending invoices / mark-paid actions.
        subscription_checkout:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Public IPN endpoint (PaymentWebhookController) — per client IP. Generous
        # because Netopia may resend a notification several times per payment
        # (status transitions + retries), but tight enough to blunt a flood from
        # a spoofed source before signature verification even runs.
        payment_webhook:
            policy: sliding_window
            limit: 120
            interval: '1 hour'
        # Login throttling tiers consumed by App\Security\LoginRateLimiter (audit #16).
        # global = per client IP; local = per IP+username (Symfony default shape);
        # username = per account across ALL IPs, to stop a botnet rotating IPs.
        login_global:
            policy: sliding_window
            limit: 25
            interval: '1 minute'
        login_local:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        login_username:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

when@test:
    framework:
        rate_limiter:
            registration:
                policy: no_limit
            registration_attempt:
                policy: no_limit
            forgot_password:
                policy: no_limit
            case_creation:
                policy: no_limit
            document_upload:
                policy: no_limit
            document_upload_request:
                policy: no_limit
            company_lookup:
                policy: no_limit
            summons_generation:
                policy: no_limit
            payment_order_generation:
                policy: no_limit
            portal_check:
                policy: no_limit
            portal_search:
                policy: no_limit
            extraction_ai_text:
                policy: no_limit
            extraction_ai_vision:
                policy: no_limit
            extraction_ai_vision_burst:
                policy: no_limit
            table_data:
                policy: no_limit
            subscription_checkout:
                policy: no_limit
            payment_webhook:
                policy: no_limit
            login_global:
                policy: no_limit
            login_local:
                policy: no_limit
            login_username:
                policy: no_limit

# Loosen the public onboarding limiters locally so repeated manual testing of the
# signup/reset flows is not throttled. Production keeps the real limits above.
when@dev:
    framework:
        rate_limiter:
            registration:
                policy: no_limit
            registration_attempt:
                policy: no_limit
            forgot_password:
                policy: no_limit
            # Walking a real ANAF payload through the wizard burns one token per
            # company, and 10/hour runs out mid-session. ANAF's own endpoint is
            # free and unauthenticated, so the local budget protects nothing.
            company_lookup:
                policy: no_limit
