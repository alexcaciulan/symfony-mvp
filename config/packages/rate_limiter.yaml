framework:
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        forgot_password:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        case_creation:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        document_upload:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        company_lookup:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        summons_generation:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        payment_order_generation:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Manual portal.just.ro check (Pas 6.1 CasePortalController::checkNow) —
        # SOAP I/O extern la cerere; limitează abuzul de butonul „Verifică acum".
        portal_check:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Auto-discovery search on portal.just.ro (CasePortalController::discover) —
        # SOAP party search to find a case before its ECRIS number is known. One
        # search may fan out to several SOAP calls (one per debtor), so keep it tight.
        portal_search:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # AI extraction limiters — per-user (consumed by Pas 2.5.7 OcrTextStrategy
        # + Pas 2.5.8 AiVisionStrategy, NOT by AnthropicApiClient itself).
        # Daily windows reflect typical lawyer-volume + Anthropic pricing tiers.
        extraction_ai_text:
            policy: sliding_window
            limit: 200
            interval: '1 day'
        extraction_ai_vision:
            policy: sliding_window
            limit: 50
            interval: '1 day'
        # Server-side table data endpoint (TableController). Generous per-user
        # window: filtering/sorting/paging fire one request each.
        table_data:
            policy: sliding_window
            limit: 600
            interval: '1 hour'
        # Subscribe + checkout POSTs (SubscriptionController) — per user; prevents
        # spamming pending invoices / mark-paid actions.
        subscription_checkout:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Public IPN endpoint (PaymentWebhookController) — per client IP. Generous
        # because Netopia may resend a notification several times per payment
        # (status transitions + retries), but tight enough to blunt a flood from
        # a spoofed source before signature verification even runs.
        payment_webhook:
            policy: sliding_window
            limit: 120
            interval: '1 hour'
        # Login throttling tiers consumed by App\Security\LoginRateLimiter (audit #16).
        # global = per client IP; local = per IP+username (Symfony default shape);
        # username = per account across ALL IPs, to stop a botnet rotating IPs.
        login_global:
            policy: sliding_window
            limit: 25
            interval: '1 minute'
        login_local:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        login_username:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

when@test:
    framework:
        rate_limiter:
            registration:
                policy: no_limit
            forgot_password:
                policy: no_limit
            case_creation:
                policy: no_limit
            document_upload:
                policy: no_limit
            company_lookup:
                policy: no_limit
            summons_generation:
                policy: no_limit
            payment_order_generation:
                policy: no_limit
            portal_check:
                policy: no_limit
            portal_search:
                policy: no_limit
            extraction_ai_text:
                policy: no_limit
            extraction_ai_vision:
                policy: no_limit
            table_data:
                policy: no_limit
            subscription_checkout:
                policy: no_limit
            payment_webhook:
                policy: no_limit
            login_global:
                policy: no_limit
            login_local:
                policy: no_limit
            login_username:
                policy: no_limit
