framework:
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        forgot_password:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        case_creation:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        document_upload:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        company_lookup:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        summons_generation:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        payment_order_generation:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Manual portal.just.ro check (Pas 6.1 CasePortalController::checkNow) —
        # SOAP I/O extern la cerere; limitează abuzul de butonul „Verifică acum".
        portal_check:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # AI extraction limiters — per-user (consumed by Pas 2.5.7 OcrTextStrategy
        # + Pas 2.5.8 AiVisionStrategy, NOT by AnthropicApiClient itself).
        # Daily windows reflect typical lawyer-volume + Anthropic pricing tiers.
        extraction_ai_text:
            policy: sliding_window
            limit: 200
            interval: '1 day'
        extraction_ai_vision:
            policy: sliding_window
            limit: 50
            interval: '1 day'

when@test:
    framework:
        rate_limiter:
            registration:
                policy: no_limit
            forgot_password:
                policy: no_limit
            case_creation:
                policy: no_limit
            document_upload:
                policy: no_limit
            company_lookup:
                policy: no_limit
            summons_generation:
                policy: no_limit
            payment_order_generation:
                policy: no_limit
            portal_check:
                policy: no_limit
            extraction_ai_text:
                policy: no_limit
            extraction_ai_vision:
                policy: no_limit
