# LexRecovery application-specific configuration.
#
# `working_days.additional_holidays` — date ISO-8601 (YYYY-MM-DD) declarate ca
# sărbători legale suplimentare în plus față de Codul Muncii art. 139. Folosit
# pentru OG-uri ad-hoc (ex: vacanță judecătorească iulie-august, zile speciale
# declarate non-lucrătoare prin hotărâre de Guvern). `WorkingDayResolver` le va
# prorogă identic cu sărbătorile fixe.
parameters:
    lexrecovery.working_days.additional_holidays: []
    # Product brand name, single source of truth. Exposed to Twig as the `brand_name`
    # global (config/packages/twig.yaml) so templates and emails never hardcode it.
    app.brand_name: 'LexRecovery'
    # Absolute session lifetime in seconds (12h): forced re-login regardless of activity,
    # on top of the 30-min idle expiry. Injected into AbsoluteSessionTimeoutSubscriber.
    app.session.absolute_ttl: 43200
