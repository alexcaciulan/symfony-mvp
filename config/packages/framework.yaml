# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Honor X-Forwarded-* from the proxy chain (nginx dev, Traefik/Coolify prod) so
    # TLS is detected (Secure cookie) and getClientIp() keys rate limiters per real
    # client. Env-driven so prod pins the exact ingress CIDR (see TRUSTED_PROXIES).
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    session:
        cookie_secure: auto        # Secure once isSecure() is true behind the TLS ingress
        cookie_httponly: true
        cookie_samesite: lax
        cookie_lifetime: 0         # browser-session cookie
        # Marks sessions idle > 30 min as GC-eligible; the actual sweep is probabilistic
        # (gc_probability/gc_divisor). A hard absolute ceiling is a later, code-level add.
        gc_maxlifetime: 1800

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # Skip the HaveIBeenPwned network call in tests (flaky, non-deterministic); the
        # length + PasswordStrength constraints still run locally.
        validation:
            not_compromised_password:
                enabled: false
