# Test-only public aliases for services that have no production consumer yet.
#
# Symfony's container compiler removes/inlines services nobody injects, which
# defeats integration tests that try to fetch them via the test container. We
# explicitly mark such services public ONLY in the test environment so the
# tests can verify autowiring + tagged-iterator wiring before the real consumer
# lands.
#
# Each entry should have a TODO referencing the step that will introduce a
# real consumer — at that point the entry can be removed and the service
# survives compilation on its own.
services:
    # TODO(Pas 3.0): drop after the wizard upload controller injects DataExtractionService.
    # Public alias under a distinct id — Symfony's `App\:` prototype resource
    # in main services.yaml claims the FQCN as a private service, and merging
    # via the same id is unreliable across container compilation passes. A
    # fresh test-only id sidesteps the conflict and keeps the alias visible.
    test.public.data_extraction_service:
        alias: App\Service\Extraction\DataExtractionService
        public: true

    # TODO(Pas 4.2): drop after DeadlineCreationSubscriber injects DeadlineService.
    test.public.deadline_service:
        alias: App\Service\Deadline\DeadlineService
        public: true

    # Pas 4.2 — subscriber e auto-tagged via #[AsDoctrineListener] + #[AsEventListener]
    # dar nu are caller direct; test idempotency-ului apelează manual `onSomatieTrimisa`.
    App\EventSubscriber\DeadlineCreationSubscriber:
        public: true

    # Replace the real Mercure hub with an in-memory recorder so the suite never
    # POSTs to the hub over the network. Without this, kernel/web tests that run
    # the real event flow (e.g. WizardStep0CascadeTest -> ExtractionMercurePublisher)
    # publish live to the hub container. Public so tests can assert the payloads.
    App\Tests\Support\RecordingHub:
        public: true
    Symfony\Component\Mercure\HubInterface:
        alias: App\Tests\Support\RecordingHub
        public: true

    # Same reasoning for the LLM provider: the test API key is a non-empty
    # placeholder, so without this alias any test that runs the real cascade for
    # an AI-allowed account uploads its fixture document to Anthropic over the
    # network and its outcome depends on the connection.
    App\Tests\Support\OfflineLlmClient:
        public: true
    App\Service\Llm\LlmClientInterface:
        alias: App\Tests\Support\OfflineLlmClient
        public: true

    # The prompt registry has no public consumer either: it is injected into the
    # vision strategy, which the cascade holds privately. Exposed so the DI test
    # can confirm every tagged prompt really reached it.
    test.public.extraction_prompt_registry:
        alias: App\Service\Extraction\Prompt\ExtractionPromptRegistry
        public: true
