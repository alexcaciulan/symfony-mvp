# Loaded after config/services.yaml in the test environment, so these replace
# definitions the App\ prototype registers there (an override placed under
# config/packages/test/ would be overwritten by that prototype).
services:
    # The wizard looks a debtor's fiscal status up on its own at the
    # confirmation step; without this the suite would query ANAF over the
    # network for every unsynced company debtor it walks to step 4.
    App\Service\Company\AnafLookupService:
        class: App\Tests\Support\OfflineAnafLookupService
        public: true

    # Court filings are recorded instead of sent; the decorated transport is the
    # `null://` one built from .env.test, so even a bypass would go nowhere.
    App\Tests\Support\RecordingCourtTransport:
        decorates: app.court_filing_transport
        arguments: ['@.inner']
        public: true

    # The inbound source the poll reads (the fixture source in tests), public so
    # end-to-end tests can queue a message built from a real submission.
    test.public.inbound_source:
        alias: App\Service\Inbound\InboundMailSourceInterface
        public: true
